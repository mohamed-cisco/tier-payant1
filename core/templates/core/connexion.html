{% load static %}

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connexion - Tiers Payant</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #123b65, #1e5b91);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-wrapper {
            width: 100%;
            max-width: 430px;
        }

        .login-box {
            background: white;
            padding: 38px;
            border-radius: 16px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, .20);
        }

        .logo {
            display: block;
            width: 170px;
            height: 75px;
            object-fit: contain;
            margin: 0 auto 15px;
        }

        h1 {
            text-align: center;
            margin: 0;
            color: #123b65;
            font-size: 25px;
            letter-spacing: .5px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin: 8px 0 30px;
            font-size: 14px;
        }

        .messages {
            margin-bottom: 18px;
        }

        .error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #b91c1c;
            padding: 12px 14px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #334155;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: #fff;
            color: #1f2937;
            font-size: 15px;
            outline: none;
            transition: .2s;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, .10);
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 8px;
            border: none;
            border-radius: 8px;
            background: #123b65;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: .2s;
        }

        button:hover {
            background: #0d2d4d;
        }

        .footer {
            text-align: center;
            color: rgba(255,255,255,.85);
            font-size: 12px;
            margin-top: 18px;
        }

        @media (max-width: 500px) {
            .login-box {
                padding: 28px 22px;
            }

            .logo {
                width: 140px;
                height: 65px;
            }

            h1 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

<div class="login-wrapper">

    <div class="login-box">

        <img
            src="{% static 'core/img/logo-sagps.png' %}"
            alt="Logo SAGPS"
            class="logo"
        >

        <h1>TIERS PAYANT</h1>

        <div class="subtitle">
            Connexion à l'application
        </div>

        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="error">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        <form method="post">

            {% csrf_token %}

            {{ form.non_field_errors }}

            <div class="field">

                <label for="{{ form.nom_utilisateur.id_for_label }}">
                    Nom utilisateur
                </label>

                {{ form.nom_utilisateur }}

            </div>

            <div class="field">

                <label for="{{ form.mot_de_passe.id_for_label }}">
                    Mot de passe
                </label>

                {{ form.mot_de_passe }}

            </div>

            <button type="submit">
                🔐 Se connecter
            </button>

        </form>

    </div>

    <div class="footer">
        © 2026 — Plateforme Tiers Payant
    </div>

</div>

</body>
</html>
